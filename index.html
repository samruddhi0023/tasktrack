<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0F0D16" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="TaskTrack" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<title>TaskTrack</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Fraunces:ital,wght@1,500&family=Inter:wght@400;500;600;700&display=swap');
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0F0D16; overscroll-behavior-y: contain; }
  body { -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; }
  ::selection { background: #8B5CF655; }
  @keyframes drift { 0% { transform: translate(0,0); } 50% { transform: translate(-3%,4%); } 100% { transform: translate(0,0); } }
  @keyframes rise { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-140px) rotate(240deg); opacity: 0; } }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

/* ---------- storage ---------- */
const storage = {
  get(key) { const v = localStorage.getItem(key); return Promise.resolve(v !== null ? { key, value: v } : null); },
  set(key, value) { localStorage.setItem(key, value); return Promise.resolve({ key, value }); },
  delete(key) { localStorage.removeItem(key); return Promise.resolve({ key, deleted: true }); },
  list(prefix = "") { const keys = Object.keys(localStorage).filter((k) => k.startsWith(prefix)); return Promise.resolve({ keys, prefix }); },
};

/* ---------- date helpers ---------- */
const pad = (n) => String(n).padStart(2, "0");
const toKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = (k) => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const nd = new Date(d); nd.setDate(nd.getDate()+n); return nd; };
const isSameDay = (a,b) => toKey(a) === toKey(b);
const todayDate = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const fmtLong = (d) => d.toLocaleDateString("en-US", { weekday: "long", day: "numeric", month: "long" });
const fmtShort = (d) => d.toLocaleDateString("en-US", { day: "numeric", month: "short" });
const dayLetter = (d) => d.toLocaleDateString("en-US", { weekday: "short" });
const fmtClock = (d) => d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", second: "2-digit" });
const msUntilMidnight = (d) => { const mid = new Date(d); mid.setHours(24,0,0,0); return mid - d; };

const CATEGORIES = [
  { id: "health", label: "Health", color: "#2DD4BF" },
  { id: "work", label: "Work", color: "#8B5CF6" },
  { id: "learning", label: "Learning", color: "#38BDF8" },
  { id: "personal", label: "Personal", color: "#F5A623" },
];
const catMeta = (id) => CATEGORIES.find((c) => c.id === id) || CATEGORIES[3];

function rateStatus(rate, hasTasks) {
  if (!hasTasks) return { label: "empty", color: "#2A2733" };
  if (rate === 1) return { label: "perfect", color: "#34D399" };
  if (rate >= 0.7) return { label: "good", color: "#84CC16" };
  if (rate >= 0.4) return { label: "average", color: "#FBBF24" };
  if (rate > 0) return { label: "low", color: "#FB923C" };
  return { label: "missed", color: "#F87171" };
}

const QUOTES = [
  "Discipline today leads to freedom tomorrow.",
  "Small steps, repeated daily, outrun big leaps taken rarely.",
  "You don't need more time. You need more focus.",
  "Consistency is the quietest form of confidence.",
  "One good hour beats ten distracted ones.",
  "Show up for yourself before anyone else asks you to.",
  "Progress hides inside boring, repeated days.",
  "The version of you a year from now is built today.",
  "Calm mind, clear list, steady progress.",
  "Focus is a muscle. Today's rep counts.",
  "Done is better than perfect — just begin.",
  "Your streak isn't about perfection, it's about return.",
];
const quoteForDate = (d) => QUOTES[Math.abs(toKey(d).split("").reduce((a,c)=>a+c.charCodeAt(0),0)) % QUOTES.length];

/* ---------- root app ---------- */
function TaskTrack() {
  const [ready, setReady] = useState(false);
  const [taskMap, setTaskMap] = useState({});
  const [journalMap, setJournalMap] = useState({});
  const [selected, setSelected] = useState(todayDate());
  const [now, setNow] = useState(new Date());
  const [showAdd, setShowAdd] = useState(false);
  const [tab, setTab] = useState("home");
  const [error, setError] = useState("");
  const [celebrate, setCelebrate] = useState(false);

  // real-time clock, ticks every second, also drives midnight rollover
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);
  const today = useMemo(() => todayDate(), [now.toDateString()]);

  useEffect(() => {
    (async () => {
      try {
        const list = await storage.list("tasks:");
        const entries = await Promise.all((list?.keys || []).map(async (k) => {
          const r = await storage.get(k);
          return [k.replace("tasks:", ""), r?.value ? JSON.parse(r.value) : []];
        }));
        const map = {}; entries.forEach(([date, t]) => (map[date] = t));
        setTaskMap(map);

        const jlist = await storage.list("journal:");
        const jentries = await Promise.all((jlist?.keys || []).map(async (k) => {
          const r = await storage.get(k);
          return [k.replace("journal:", ""), r?.value || ""];
        }));
        const jmap = {}; jentries.forEach(([date, v]) => (jmap[date] = v));
        setJournalMap(jmap);
      } catch { setError("Couldn't load saved data — starting fresh."); }
      finally { setReady(true); }
    })();
  }, []);

  const saveDay = useCallback(async (dateKey, tasks) => {
    setTaskMap((prev) => ({ ...prev, [dateKey]: tasks }));
    try { await storage.set(`tasks:${dateKey}`, JSON.stringify(tasks)); }
    catch { setError("Couldn't save — storage may be full."); }
  }, []);

  const saveJournal = useCallback(async (dateKey, text) => {
    setJournalMap((prev) => ({ ...prev, [dateKey]: text }));
    try { await storage.set(`journal:${dateKey}`, text); } catch {}
  }, []);

  const getTasks = useCallback((k) => taskMap[k] || [], [taskMap]);
  const vibrate = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

  const toggleTask = (dateKey, id) => {
    const tasks = getTasks(dateKey).map((t) => (t.id === id ? { ...t, completed: !t.completed } : t));
    saveDay(dateKey, tasks);
    vibrate(15);
    if (tasks.length && tasks.every((t) => t.completed)) {
      setCelebrate(true);
      vibrate([20, 40, 20]);
      setTimeout(() => setCelebrate(false), 1800);
    }
  };
  const deleteTask = (dateKey, id) => saveDay(dateKey, getTasks(dateKey).filter((t) => t.id !== id));
  const addTask = ({ title, category, time, dates }) => {
    const genId = () => Math.random().toString(36).slice(2, 9);
    dates.forEach((dateKey) => {
      const tasks = [...getTasks(dateKey), { id: genId(), title, category, time, completed: false }];
      tasks.sort((a,b) => (a.time || "99:99").localeCompare(b.time || "99:99"));
      saveDay(dateKey, tasks);
    });
    vibrate(10);
  };

  const rateFor = (dateKey) => {
    const tasks = getTasks(dateKey);
    if (tasks.length === 0) return { rate: 0, hasTasks: false, done: 0, total: 0 };
    const done = tasks.filter((t) => t.completed).length;
    return { rate: done / tasks.length, hasTasks: true, done, total: tasks.length };
  };

  const currentStreak = useMemo(() => {
    let streak = 0;
    const t = rateFor(toKey(today));
    if (t.hasTasks && t.rate >= 0.7) streak++;
    let cursor = addDays(today, -1);
    while (true) {
      const r = rateFor(toKey(cursor));
      if (r.hasTasks && r.rate >= 0.7) { streak++; cursor = addDays(cursor, -1); } else break;
    }
    return streak;
  }, [taskMap, today]);

  const longestStreak = useMemo(() => {
    const keys = Object.keys(taskMap).sort();
    if (keys.length === 0) return 0;
    let longest = 0, run = 0, cursor = fromKey(keys[0]);
    while (cursor <= today) {
      const r = rateFor(toKey(cursor));
      if (r.hasTasks && r.rate >= 0.7) { run++; longest = Math.max(longest, run); } else run = 0;
      cursor = addDays(cursor, 1);
    }
    return longest;
  }, [taskMap, today]);

  const weekRate = useMemo(() => {
    let done = 0, total = 0;
    for (let i = 0; i < 7; i++) { const r = rateFor(toKey(addDays(today, -i))); done += r.done; total += r.total; }
    return total ? Math.round((done/total)*100) : 0;
  }, [taskMap, today]);

  const selectedKey = toKey(selected);
  const selectedTasks = getTasks(selectedKey);
  const selectedDone = selectedTasks.filter((t) => t.completed).length;

  const calendarWeeks = useMemo(() => {
    const endOfWeek = addDays(today, (7 - (today.getDay() === 0 ? 7 : today.getDay())));
    let cursor = addDays(endOfWeek, -1 * (5*7 - 1));
    cursor = addDays(cursor, -((cursor.getDay()+6)%7));
    const weeks = [];
    for (let w=0; w<5; w++) { const week=[]; for(let d=0; d<7; d++){ week.push(new Date(cursor)); cursor=addDays(cursor,1);} weeks.push(week); }
    return weeks;
  }, [today]);

  const last7 = useMemo(() => Array.from({length:7},(_,i)=>addDays(today, i-6)), [today]);
  const greeting = (() => { const h = now.getHours(); return h<12?"Good morning":h<17?"Good afternoon":"Good evening"; })();

  const touchX = useRef(null);
  const onTouchStart = (e) => { touchX.current = e.touches[0].clientX; };
  const onTouchEnd = (e) => {
    if (touchX.current === null) return;
    const dx = e.changedTouches[0].clientX - touchX.current;
    if (Math.abs(dx) > 60) setSelected((s) => addDays(s, dx < 0 ? 1 : -1));
    touchX.current = null;
  };

  if (!ready) {
    return <div style={{...styles.app, display:"flex", alignItems:"center", justifyContent:"center"}}>
      <div style={{color:"#9691A8", fontFamily:"Inter, sans-serif"}}>Loading TaskTrack…</div>
    </div>;
  }

  const msLeft = msUntilMidnight(now);
  const hrsLeft = Math.floor(msLeft / 3600000);
  const minLeft = Math.floor((msLeft % 3600000) / 60000);

  return (
    <div style={styles.app}>
      <div style={styles.bgOrb1} />
      <div style={styles.bgOrb2} />
      {celebrate && <Confetti />}

      <div style={styles.scrollArea} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
        <header style={styles.header}>
          <div style={styles.logo}><span style={styles.logoMark}>✓</span>Task<span style={{color:"#8B5CF6"}}>Track</span></div>
          <DateNav selected={selected} today={today} onChange={setSelected} />
        </header>

        <div style={styles.clockBar}>
          <span style={styles.clockTime}>{fmtClock(now)}</span>
          <span style={styles.clockDivider}>·</span>
          <span style={styles.clockSub}>{hrsLeft}h {minLeft}m left today</span>
        </div>

        {error && <div style={styles.errorBanner}>{error}</div>}

        {tab === "home" && (
          <HomeTab
            greeting={greeting} selected={selected} today={today}
            currentStreak={currentStreak} longestStreak={longestStreak} weekRate={weekRate}
            selectedDone={selectedDone} selectedTasks={selectedTasks}
            calendarWeeks={calendarWeeks} rateFor={rateFor} setSelected={setSelected} setTab={setTab}
          />
        )}
        {tab === "tasks" && (
          <TasksTab
            selected={selected} selectedKey={selectedKey} today={today}
            selectedTasks={selectedTasks} selectedDone={selectedDone}
            toggleTask={toggleTask} deleteTask={deleteTask}
            journal={journalMap[selectedKey] || ""} saveJournal={(v)=>saveJournal(selectedKey, v)}
          />
        )}
        {tab === "focus" && <FocusTab today={today} now={now} />}
        {tab === "streak" && (
          <StreakTab
            calendarWeeks={calendarWeeks} rateFor={rateFor} selected={selected} setSelected={setSelected}
            last7={last7} currentStreak={currentStreak} longestStreak={longestStreak}
          />
        )}

        <div style={{height: 90}} />
      </div>

      <button style={styles.fab} onClick={() => setShowAdd(true)}>+</button>

      <nav style={styles.bottomNav}>
        <NavBtn active={tab==="home"} onClick={()=>setTab("home")} icon="🏠" label="Home" />
        <NavBtn active={tab==="tasks"} onClick={()=>setTab("tasks")} icon="✓" label="Tasks" />
        <NavBtn active={tab==="focus"} onClick={()=>setTab("focus")} icon="◎" label="Focus" />
        <NavBtn active={tab==="streak"} onClick={()=>setTab("streak")} icon="🔥" label="Streak" />
      </nav>

      {showAdd && (
        <AddTaskModal selected={selected} onClose={()=>setShowAdd(false)}
          onSave={(payload)=>{ addTask(payload); setShowAdd(false); }} />
      )}
    </div>
  );
}

/* ---------- HOME TAB ---------- */
function HomeTab({ greeting, selected, today, currentStreak, longestStreak, weekRate, selectedDone, selectedTasks, calendarWeeks, rateFor, setSelected, setTab }) {
  const quote = quoteForDate(today);
  const isToday = isSameDay(selected, today);
  const last7days = calendarWeeks[calendarWeeks.length-1];
  return (
    <div>
      <h1 style={styles.greeting}>{greeting}{isToday ? "" : ", planning ahead"}</h1>
      <p style={styles.subtitle}>Stay consistent, stay unstoppable.</p>

      <div style={styles.quoteCard}>
        <div style={styles.quoteMark}>"</div>
        <div style={styles.quoteText}>{quote}</div>
      </div>

      <section style={styles.statGrid}>
        <StatCard label="Today" value={`${selectedDone}/${selectedTasks.length}`} sub="tasks done" accent="#34D399" icon="✓" />
        <StatCard label="Streak" value={currentStreak} sub="days" accent="#8B5CF6" icon="🔥" />
        <StatCard label="Best" value={longestStreak} sub="days" accent="#F5A623" icon="🏆" />
        <StatCard label="This Week" value={`${weekRate}%`} sub="completion" accent="#38BDF8" icon="📈" />
      </section>

      <section style={styles.card}>
        <div style={styles.cardHeaderRow}>
          <h2 style={styles.cardTitle}>This Week</h2>
          <button style={styles.linkBtn} onClick={()=>setTab("streak")}>Full calendar →</button>
        </div>
        <div style={styles.calRow}>
          {last7days.map((d,i) => {
            const r = rateFor(toKey(d));
            const status = rateStatus(r.rate, r.hasTasks);
            const isFuture = d > today;
            const isSel = isSameDay(d, selected);
            return (
              <button key={i} onClick={()=>{setSelected(d); setTab("tasks");}} style={styles.weekStripBtn}>
                <div style={styles.calDayLabel}>{dayLetter(d)}</div>
                <div style={{...styles.calCellBig, background: isFuture ? "#1C1926" : status.color, opacity: isFuture?0.4:1, outline: isSel?"2px solid #fff":"none"}} />
              </button>
            );
          })}
        </div>
      </section>

      <section style={styles.card}>
        <div style={styles.cardHeaderRow}>
          <h2 style={styles.cardTitle}>{isToday ? "Today's Tasks" : fmtLong(selected)}</h2>
          <button style={styles.linkBtn} onClick={()=>setTab("tasks")}>Open →</button>
        </div>
        {selectedTasks.length === 0 ? (
          <div style={styles.emptyState}>Nothing planned yet. Head to Tasks to add your first one.</div>
        ) : (
          <div style={{display:"flex", flexDirection:"column", gap:6}}>
            {selectedTasks.slice(0,4).map((t) => {
              const cat = catMeta(t.category);
              return (
                <div key={t.id} style={styles.miniTaskRow}>
                  <span style={{...styles.miniDot, background: t.completed ? "#34D399" : cat.color}} />
                  <span style={{flex:1, fontSize:13, textDecoration: t.completed?"line-through":"none", opacity: t.completed?0.5:1}}>{t.title}</span>
                </div>
              );
            })}
            {selectedTasks.length > 4 && <div style={{fontSize:12, color:"#6C687A"}}>+{selectedTasks.length-4} more</div>}
          </div>
        )}
      </section>
    </div>
  );
}

/* ---------- TASKS TAB ---------- */
function TasksTab({ selected, selectedKey, today, selectedTasks, selectedDone, toggleTask, deleteTask, journal, saveJournal }) {
  const [note, setNote] = useState(journal);
  useEffect(() => setNote(journal), [selectedKey]);
  return (
    <div>
      <h1 style={{...styles.greeting, fontSize:19}}>{isSameDay(selected, today) ? "Today" : fmtLong(selected)}</h1>
      <p style={styles.subtitle}>Swipe left or right to switch days.</p>

      <div style={styles.progressTrack}>
        <div style={{...styles.progressFill, width: selectedTasks.length ? `${(selectedDone/selectedTasks.length)*100}%` : "0%"}} />
      </div>
      <div style={{fontSize:12, color:"#8B879A", margin:"6px 0 16px"}}>{selectedDone} of {selectedTasks.length} complete</div>

      <div style={styles.taskList}>
        {selectedTasks.length === 0 && (
          <div style={styles.emptyState}>No tasks planned for {fmtShort(selected)} yet. Tap the + button to plan this day — or a whole week at once.</div>
        )}
        {selectedTasks.map((t) => {
          const cat = catMeta(t.category);
          return (
            <div key={t.id} style={styles.taskRow}>
              <button onClick={()=>toggleTask(selectedKey, t.id)} style={{...styles.checkbox, background: t.completed?"#34D399":"transparent", borderColor: t.completed?"#34D399":"#4A4658"}}>{t.completed?"✓":""}</button>
              <div style={{flex:1, minWidth:0}}>
                <div style={{...styles.taskTitle, textDecoration: t.completed?"line-through":"none", opacity: t.completed?0.55:1}}>{t.title}</div>
                <span style={{...styles.tag, color: cat.color, background: cat.color+"22"}}>{cat.label}</span>
              </div>
              {t.time && <div style={styles.taskTime}>{t.time}</div>}
              <button onClick={()=>deleteTask(selectedKey, t.id)} style={styles.deleteBtn}>✕</button>
            </div>
          );
        })}
      </div>

      <section style={{...styles.card, marginTop:16}}>
        <h2 style={styles.cardTitle}>Quick Reflection</h2>
        <p style={{fontSize:12, color:"#6C687A", margin:"4px 0 10px"}}>One line about how the day went — helps you notice patterns later.</p>
        <textarea value={note} onChange={(e)=>setNote(e.target.value)} onBlur={()=>saveJournal(note)}
          placeholder="e.g. Focused well in the morning, lost momentum after lunch…" style={styles.textarea} />
      </section>
    </div>
  );
}

/* ---------- FOCUS TAB — timestamp based, survives lock/background ---------- */
const WORK_SECS = 25*60, BREAK_SECS = 5*60;

function loadSession() {
  try {
    const raw = localStorage.getItem("focusSession");
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function saveSession(s) { localStorage.setItem("focusSession", JSON.stringify(s)); }
function clearSession() { localStorage.removeItem("focusSession"); }

function computeRemaining(session, now) {
  if (!session) return null;
  const elapsed = Math.floor((now - session.startedAt) / 1000);
  const remaining = session.duration - elapsed;
  return remaining;
}

function FocusTab({ today, now }) {
  const [session, setSession] = useState(() => loadSession());
  const [mode, setMode] = useState(session?.mode || "work");
  const [sessions, setSessions] = useState(0);
  const notifiedRef = useRef(false);

  useEffect(() => {
    (async () => {
      const r = await storage.get(`focus:${toKey(today)}`);
      setSessions(r?.value ? Number(r.value) : 0);
    })();
  }, [today]);

  useEffect(() => {
    if ("Notification" in window && Notification.permission === "default") {
      // ask only once, quietly, the first time this tab is opened
    }
  }, []);

  // recompute remaining every tick from wall-clock time — correct even after the phone was locked
  const remaining = useMemo(() => {
    if (!session || !session.running) return session ? session.remaining : (mode === "work" ? WORK_SECS : BREAK_SECS);
    const r = computeRemaining(session, now.getTime());
    return r;
  }, [session, now, mode]);

  useEffect(() => {
    if (session && session.running && remaining <= 0 && !notifiedRef.current) {
      notifiedRef.current = true;
      const finishedMode = session.mode;
      if (finishedMode === "work") {
        const next = sessions + 1;
        setSessions(next);
        storage.set(`focus:${toKey(today)}`, String(next));
      }
      try { navigator.vibrate && navigator.vibrate([30,60,30]); } catch {}
      try {
        if ("Notification" in window && Notification.permission === "granted") {
          new Notification(finishedMode === "work" ? "Focus session done 🌿" : "Break's over — back to it", {
            body: finishedMode === "work" ? "Nice deep-work block. Take a 5 min break." : "Ready for another focus round?",
          });
        }
      } catch {}
      const nextMode = finishedMode === "work" ? "break" : "work";
      const nextDuration = nextMode === "work" ? WORK_SECS : BREAK_SECS;
      const newSession = { mode: nextMode, running: false, remaining: nextDuration, startedAt: null, duration: nextDuration };
      setSession(newSession); saveSession(newSession); setMode(nextMode);
      notifiedRef.current = false;
    }
  }, [remaining, session, sessions, today]);

  const requestNotifPermission = () => {
    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission();
    }
  };

  const start = () => {
    requestNotifPermission();
    const duration = session && !session.running ? (session.remaining ?? (mode === "work" ? WORK_SECS : BREAK_SECS)) : (mode === "work" ? WORK_SECS : BREAK_SECS);
    const newSession = { mode, running: true, startedAt: Date.now(), duration, remaining: duration };
    setSession(newSession); saveSession(newSession);
  };
  const pause = () => {
    const r = computeRemaining(session, Date.now());
    const newSession = { ...session, running: false, remaining: Math.max(0, r), startedAt: null };
    setSession(newSession); saveSession(newSession);
  };
  const reset = () => {
    const duration = mode === "work" ? WORK_SECS : BREAK_SECS;
    const newSession = { mode, running: false, remaining: duration, startedAt: null, duration };
    setSession(newSession); saveSession(newSession);
  };
  const switchMode = (m) => {
    const duration = m === "work" ? WORK_SECS : BREAK_SECS;
    const newSession = { mode: m, running: false, remaining: duration, startedAt: null, duration };
    setMode(m); setSession(newSession); saveSession(newSession);
  };

  const displaySeconds = Math.max(0, remaining ?? (mode === "work" ? WORK_SECS : BREAK_SECS));
  const total = mode === "work" ? WORK_SECS : BREAK_SECS;
  const pct = 1 - displaySeconds/total;
  const mm = pad(Math.floor(displaySeconds/60)), ss = pad(displaySeconds%60);
  const r = 90, circumference = 2*Math.PI*r;
  const running = !!(session && session.running);

  return (
    <div>
      <h1 style={{...styles.greeting, fontSize:19}}>Focus</h1>
      <p style={styles.subtitle}>{mode==="work" ? "Deep work — keeps counting accurately even if your phone locks." : "Short break. Stretch, breathe, look away from the screen."}</p>

      <div style={styles.focusWrap}>
        <svg width="220" height="220" viewBox="0 0 220 220" style={{ filter: running ? "drop-shadow(0 0 18px #8B5CF666)" : "none" }}>
          <circle cx="110" cy="110" r={r} stroke="#211D2C" strokeWidth="14" fill="none" />
          <circle cx="110" cy="110" r={r} stroke={mode==="work" ? "#8B5CF6" : "#2DD4BF"} strokeWidth="14" fill="none"
            strokeDasharray={circumference} strokeDashoffset={circumference*(1-pct)} strokeLinecap="round"
            transform="rotate(-90 110 110)" style={{transition:"stroke-dashoffset 1s linear"}} />
          <text x="110" y="104" textAnchor="middle" fontSize="34" fontWeight="700" fill="#F3F1FA" fontFamily="Sora, sans-serif">{mm}:{ss}</text>
          <text x="110" y="128" textAnchor="middle" fontSize="12" fill="#8B879A">{mode === "work" ? "focus" : "break"}</text>
        </svg>
      </div>

      <div style={styles.focusControls}>
        <button style={styles.focusModeBtn(mode==="work")} onClick={()=>switchMode("work")}>Focus 25</button>
        <button style={styles.focusModeBtn(mode==="break")} onClick={()=>switchMode("break")}>Break 5</button>
      </div>

      <div style={{display:"flex", gap:12, marginTop:18}}>
        <button style={styles.primaryBig} onClick={running ? pause : start}>{running ? "Pause" : "Start"}</button>
        <button style={styles.secondaryBig} onClick={reset}>Reset</button>
      </div>

      {running && (
        <p style={{fontSize:11.5, color:"#6C687A", textAlign:"center", marginTop:14, lineHeight:1.5}}>
          You can lock your phone — the time keeps counting for real. Reopen the app anytime to see where it's at.
        </p>
      )}

      <section style={{...styles.card, marginTop:20}}>
        <div style={styles.cardHeaderRow}><h2 style={styles.cardTitle}>Today's Focus Sessions</h2></div>
        <div style={{display:"flex", alignItems:"baseline", gap:8}}>
          <span style={{fontSize:30, fontWeight:700, color:"#F3F1FA"}}>{sessions}</span>
          <span style={{fontSize:12, color:"#8B879A"}}>× 25 min completed</span>
        </div>
      </section>
    </div>
  );
}

/* ---------- STREAK TAB ---------- */
function StreakTab({ calendarWeeks, rateFor, selected, setSelected, last7, currentStreak, longestStreak }) {
  return (
    <div>
      <h1 style={{...styles.greeting, fontSize:19}}>Streak & Consistency</h1>
      <div style={styles.statGrid}>
        <StatCard label="Current" value={currentStreak} sub="days" accent="#8B5CF6" icon="🔥" />
        <StatCard label="Longest" value={longestStreak} sub="days" accent="#F5A623" icon="🏆" />
      </div>
      <section style={styles.card}>
        <h2 style={styles.cardTitle}>Consistency Calendar</h2>
        <div style={styles.calGrid}>
          <div style={styles.calRow}>{["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=><div key={d} style={styles.calDayLabel}>{d}</div>)}</div>
          {calendarWeeks.map((week, wi) => (
            <div style={styles.calRow} key={wi}>
              {week.map((d, di) => {
                const r = rateFor(toKey(d));
                const status = rateStatus(r.rate, r.hasTasks);
                const isFuture = d > todayDate();
                const isSel = isSameDay(d, selected);
                return (
                  <button key={di} onClick={()=>setSelected(d)} title={`${fmtShort(d)} · ${r.hasTasks?`${r.done}/${r.total}`:"no tasks"}`}
                    style={{...styles.calCell, background: isFuture?"#1C1926":status.color, opacity: isFuture?0.4:1, outline: isSel?"2px solid #fff":"none"}} />
                );
              })}
            </div>
          ))}
        </div>
        <Legend />
      </section>
      <section style={styles.card}>
        <h2 style={styles.cardTitle}>Last 7 Days</h2>
        <div style={styles.barRow}>
          {last7.map((d,i) => {
            const r = rateFor(toKey(d));
            const pct = Math.max(6, Math.round(r.rate*100));
            const status = rateStatus(r.rate, r.hasTasks);
            return (
              <div key={i} style={styles.barCol}>
                <div style={styles.barTrack}><div style={{...styles.barFill, height:`${r.hasTasks?pct:4}%`, background: status.color}} /></div>
                <div style={styles.barLabel}>{fmtShort(d)}</div>
              </div>
            );
          })}
        </div>
      </section>
    </div>
  );
}

/* ---------- shared small components ---------- */
function DateNav({ selected, today, onChange }) {
  const [open, setOpen] = useState(false);
  return (
    <div style={styles.dateNav}>
      <button style={styles.navBtn} onClick={()=>onChange(addDays(selected,-1))}>‹</button>
      <button style={styles.dateChip} onClick={()=>setOpen(o=>!o)}>{isSameDay(selected,today)?"Today":fmtShort(selected)}</button>
      <button style={styles.navBtn} onClick={()=>onChange(addDays(selected,1))}>›</button>
      {open && <input type="date" autoFocus value={toKey(selected)} onChange={(e)=>{ if(e.target.value) onChange(fromKey(e.target.value)); setOpen(false); }} onBlur={()=>setOpen(false)} style={styles.dateInput} />}
    </div>
  );
}
function NavBtn({ active, onClick, icon, label }) {
  return (
    <button onClick={onClick} style={{...styles.navTabBtn, color: active ? "#F3F1FA" : "#6C687A"}}>

}
function StatCard({ label, value, sub, accent, icon }) {
  return (
    <div style={{...styles.statCard, borderColor: accent+"33"}}>

}
function Legend() {
  const items = [["Perfect","#34D399"],["Good","#84CC16"],["Average","#FBBF24"],["Low","#FB923C"],["Missed","#F87171"],["No plan","#2A2733"]];
  return <div style={styles.legendRow}>{items.map(([l,c])=><div key={l} style={styles.legendItem}><span style={{...styles.legendDot, background:c}} />{l}</div>)}</div>;
}
function Confetti() {
  const pieces = Array.from({length: 18});
  const colors = ["#34D399","#8B5CF6","#F5A623","#38BDF8","#F87171"];
  return (
    <div style={{position:"fixed", inset:0, pointerEvents:"none", zIndex:40, display:"flex", alignItems:"flex-end", justifyContent:"center"}}>
      {pieces.map((_,i) => (
        <span key={i} style={{ position:"absolute", bottom: 120, left: `${50 + (Math.random()*60-30)}%`,
          width:8, height:8, borderRadius: i%2?2:8, background: colors[i%colors.length],
          animation: `rise ${0.9+Math.random()*0.6}s ease-out forwards`, animationDelay: `${Math.random()*0.2}s` }} />
      ))}
    </div>
  );
}

/* ---------- add task modal ---------- */
function AddTaskModal({ selected, onClose, onSave }) {
  const [title, setTitle] = useState("");
  const [category, setCategory] = useState("work");
  const [time, setTime] = useState("");
  const [mode, setMode] = useState("single");
  const [days, setDays] = useState(() => new Set([selected.getDay()]));
  const weekStart = addDays(selected, -((selected.getDay()+6)%7));
  const weekDates = Array.from({length:7}, (_,i)=>addDays(weekStart,i));
  const toggleDay = (dow) => setDays(prev => { const n=new Set(prev); n.has(dow)?n.delete(dow):n.add(dow); return n; });
  const submit = () => {
    if (!title.trim()) return;
    const dates = mode === "single" ? [toKey(selected)] : weekDates.filter(d=>days.has(d.getDay())).map(toKey);
    if (!dates.length) return;
    onSave({ title: title.trim(), category, time, dates });
  };
  return (
    <div style={styles.modalOverlay} onClick={onClose}>
      <div style={styles.modal} onClick={(e)=>e.stopPropagation()}>
        <h3 style={styles.modalTitle}>Add Task</h3>
        <label style={styles.label}>Title</label>
        <input style={styles.input} placeholder="e.g. Morning Workout" value={title} onChange={(e)=>setTitle(e.target.value)} autoFocus />
        <label style={styles.label}>Category</label>
        <div style={styles.chipRow}>
          {CATEGORIES.map(c => (
            <button key={c.id} onClick={()=>setCategory(c.id)} style={{...styles.catChip, borderColor: category===c.id?c.color:"#332F42", color: category===c.id?c.color:"#B4AFC4", background: category===c.id?c.color+"1A":"transparent"}}>{c.label}</button>
          ))}
        </div>
        <label style={styles.label}>Time (optional)</label>
        <input type="time" style={styles.input} value={time} onChange={(e)=>setTime(e.target.value)} />
        <label style={styles.label}>Plan for</label>
        <div style={styles.chipRow}>
          <button onClick={()=>setMode("single")} style={{...styles.modeChip, ...(mode==="single"?styles.modeChipActive:{})}}>{fmtShort(selected)} only</button>
          <button onClick={()=>setMode("week")} style={{...styles.modeChip, ...(mode==="week"?styles.modeChipActive:{})}}>Pick days this week</button>
        </div>
        {mode==="week" && (
          <div style={styles.weekPicker}>
            {weekDates.map(d => (
              <button key={toKey(d)} onClick={()=>toggleDay(d.getDay())} style={{...styles.weekDayBtn, background: days.has(d.getDay())?"#8B5CF6":"#211D2C", color: days.has(d.getDay())?"#fff":"#8B879A"}}>
                <div style={{fontSize:10}}>{dayLetter(d)}</div><div style={{fontSize:13, fontWeight:700}}>{d.getDate()}</div>
              </button>
            ))}
          </div>
        )}
        <div style={styles.modalActions}>
          <button style={styles.cancelBtn} onClick={onClose}>Cancel</button>
          <button style={styles.saveBtn} onClick={submit} disabled={!title.trim()}>Save Task</button>
        </div>
      </div>
    </div>
  );
}
